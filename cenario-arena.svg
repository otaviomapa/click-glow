<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Céu noturno com brilho lunar -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050711"/>
      <stop offset="38%" stop-color="#0e1428"/>
      <stop offset="72%" stop-color="#1c1d38"/>
      <stop offset="100%" stop-color="#2c2136"/>
    </linearGradient>

    <radialGradient id="moonHalo" cx="50%" cy="24%" r="42%">
      <stop offset="0%" stop-color="#fff4cc" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#d8b478" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#4e4680" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moonDisc" cx="38%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#fffdf0"/>
      <stop offset="45%" stop-color="#f5dfb0"/>
      <stop offset="82%" stop-color="#c49d62"/>
      <stop offset="100%" stop-color="#876642"/>
    </radialGradient>

    <linearGradient id="godRay" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffe7b0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffe7b0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2138"/>
      <stop offset="100%" stop-color="#0f1322"/>
    </linearGradient>

    <linearGradient id="mtnMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14182a"/>
      <stop offset="100%" stop-color="#0b0d18"/>
    </linearGradient>

    <linearGradient id="stoneDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1018"/>
      <stop offset="40%" stop-color="#252a38"/>
      <stop offset="75%" stop-color="#1a1e29"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>

    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232534"/>
      <stop offset="40%" stop-color="#161822"/>
      <stop offset="100%" stop-color="#0b0c12"/>
    </linearGradient>

    <radialGradient id="floorMoon" cx="50%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#ffe3a8" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#7c68a6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="torchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5bd" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#ff9d2e" stop-opacity="0.65"/>
      <stop offset="65%" stop-color="#d9381e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd27d" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#9e47ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mistGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b96c4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b96c4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#141624" stop-opacity="0"/>
    </linearGradient>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Céu -->
  <rect width="1200" height="720" fill="url(#skyGrad)"/>
  <rect width="1200" height="520" fill="url(#moonHalo)"/>

  <!-- Estrelas -->
  <g fill="#f6f1de" opacity="0.75">
    <circle cx="110" cy="68" r="1.4"/><circle cx="195" cy="122" r="1.1"/><circle cx="280" cy="48" r="1.6"/>
    <circle cx="370" cy="96" r="1.2"/><circle cx="440" cy="42" r="1.5"/><circle cx="760" cy="54" r="1.5"/>
    <circle cx="845" cy="112" r="1.2"/><circle cx="920" cy="46" r="1.7"/><circle cx="1015" cy="88" r="1.3"/>
    <circle cx="1110" cy="135" r="1.4"/><circle cx="150" cy="180" r="1.1"/><circle cx="1060" cy="175" r="1.2"/>
  </g>

  <!-- Lua cheia detalhada -->
  <g transform="translate(600,152)">
    <circle r="70" fill="url(#moonDisc)"/>
    <circle cx="-18" cy="-14" r="11" fill="#b8945d" opacity="0.28"/>
    <circle cx="22" cy="16" r="15" fill="#9c7946" opacity="0.26"/>
    <circle cx="-8" cy="24" r="7" fill="#a88450" opacity="0.22"/>
    <circle cx="16" cy="-22" r="6" fill="#b8945d" opacity="0.2"/>
  </g>

  <!-- Feixes de luar -->
  <polygon points="545,175 655,175 830,520 370,520" fill="url(#godRay)" filter="url(#softBlur)"/>

  <!-- Montanhas distantes -->
  <path d="M0 420 L120 315 L235 375 L380 265 L510 355 L635 280 L790 365 L930 270 L1080 350 L1200 295 L1200 500 L0 500 Z" fill="url(#mtnFar)"/>
  <path d="M0 445 L95 360 L210 410 L320 330 L455 405 L595 340 L735 412 L880 328 L1015 398 L1145 345 L1200 380 L1200 505 L0 505 Z" fill="url(#mtnMid)"/>

  <!-- Silhueta da Catedral Gótica ao fundo -->
  <g fill="#121524" stroke="#2f354d" stroke-width="1.2">
    <!-- Torres laterais -->
    <polygon points="275,470 295,180 315,470"/>
    <rect x="280" y="255" width="30" height="215"/>
    <polygon points="885,470 905,180 925,470"/>
    <rect x="890" y="255" width="30" height="215"/>

    <!-- Nave central & torres médias -->
    <rect x="345" y="275" width="510" height="195"/>
    <polygon points="345,275 410,165 475,275"/>
    <polygon points="725,275 790,165 855,275"/>
    <polygon points="485,275 600,145 715,275"/>
  </g>

  <!-- Rosácea gótica iluminada -->
  <g transform="translate(600,295)">
    <circle r="76" fill="url(#roseGlow)"/>
    <circle r="48" fill="#17142b" stroke="#5c527a" stroke-width="3"/>
    <circle r="36" fill="none" stroke="#a67eff" stroke-width="1.5" opacity="0.55"/>
    <circle r="18" fill="none" stroke="#ffd27d" stroke-width="1.5" opacity="0.5"/>
    <g stroke="#5c527a" stroke-width="2">
      <line x1="-46" y1="0" x2="46" y2="0"/>
      <line x1="0" y1="-46" x2="0" y2="46"/>
      <line x1="-32" y1="-32" x2="32" y2="32"/>
      <line x1="-32" y1="32" x2="32" y2="-32"/>
    </g>
  </g>

  <!-- Janelas ogivais iluminadas -->
  <g fill="#ffd27d" opacity="0.22">
    <path d="M395,380 L395,325 Q410,295 425,325 L425,380 Z"/>
    <path d="M445,385 L445,335 Q457,310 469,335 L469,385 Z"/>
    <path d="M731,385 L731,335 Q743,310 755,335 L755,385 Z"/>
    <path d="M775,380 L775,325 Q790,295 805,325 L805,380 Z"/>
  </g>

  <!-- Balaustrada de pedra no pátio -->
  <g fill="#191c28" stroke="#353b4f" stroke-width="1">
    <rect x="0" y="452" width="1200" height="16"/>
    <rect x="0" y="484" width="1200" height="14"/>
    <g opacity="0.85">
      <rect x="220" y="468" width="12" height="16"/><rect x="260" y="468" width="12" height="16"/>
      <rect x="300" y="468" width="12" height="16"/><rect x="340" y="468" width="12" height="16"/>
      <rect x="380" y="468" width="12" height="16"/><rect x="420" y="468" width="12" height="16"/>
      <rect x="768" y="468" width="12" height="16"/><rect x="808" y="468" width="12" height="16"/>
      <rect x="848" y="468" width="12" height="16"/><rect x="888" y="468" width="12" height="16"/>
      <rect x="928" y="468" width="12" height="16"/><rect x="968" y="468" width="12" height="16"/>
    </g>
  </g>

  <!-- Névoa sobre o pátio -->
  <rect x="0" y="410" width="1200" height="115" fill="url(#mistGrad)" filter="url(#softBlur)"/>

  <!-- Chão de pedra em perspectiva -->
  <rect x="0" y="492" width="1200" height="228" fill="url(#floorGrad)"/>
  <rect x="0" y="492" width="1200" height="228" fill="url(#floorMoon)"/>

  <!-- Linhas das lajes em perspectiva -->
  <g stroke="#3d4259" stroke-width="1.3" opacity="0.45">
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="556" x2="1200" y2="556"/>
    <line x1="0" y1="602" x2="1200" y2="602"/>
    <line x1="0" y1="660" x2="1200" y2="660"/>
    <line x1="600" y1="492" x2="600" y2="720"/>
    <line x1="510" y1="492" x2="350" y2="720"/>
    <line x1="420" y1="492" x2="110" y2="720"/>
    <line x1="330" y1="492" x2="-120" y2="720"/>
    <line x1="690" y1="492" x2="850" y2="720"/>
    <line x1="780" y1="492" x2="1090" y2="720"/>
    <line x1="870" y1="492" x2="1320" y2="720"/>
  </g>

  <!-- Círculo rúnico sagrado no chão da arena -->
  <g transform="translate(600,592)" fill="none" opacity="0.34">
    <ellipse rx="285" ry="62" stroke="#e6be73" stroke-width="2"/>
    <ellipse rx="242" ry="50" stroke="#e6be73" stroke-width="1.2" stroke-dasharray="10 8"/>
    <ellipse rx="150" ry="30" stroke="#ffd88a" stroke-width="1"/>
  </g>

  <!-- Colunas góticas em primeiro plano + Tochas -->
  <g>
    <!-- Coluna Esquerda -->
    <rect x="44" y="45" width="76" height="535" fill="url(#stoneDark)" stroke="#3e4359" stroke-width="1.4"/>
    <rect x="30" y="38" width="104" height="24" rx="3" fill="#2c3040" stroke="#535973" stroke-width="1.2"/>
    <rect x="32" y="566" width="100" height="26" rx="3" fill="#232633" stroke="#454a61" stroke-width="1.2"/>

    <!-- Coluna Direita -->
    <rect x="1080" y="45" width="76" height="535" fill="url(#stoneDark)" stroke="#3e4359" stroke-width="1.4"/>
    <rect x="1066" y="38" width="104" height="24" rx="3" fill="#2c3040" stroke="#535973" stroke-width="1.2"/>
    <rect x="1068" y="566" width="100" height="26" rx="3" fill="#232633" stroke="#454a61" stroke-width="1.2"/>

    <!-- Arco de pedra superior enquadrando a arena -->
    <path d="M82 190 Q600 -30 1118 190" fill="none" stroke="#1d212e" stroke-width="34"/>
    <path d="M82 190 Q600 -30 1118 190" fill="none" stroke="#454b63" stroke-width="2"/>

    <!-- Tocha Esquerda -->
    <circle cx="136" cy="276" r="85" fill="url(#torchGlow)"/>
    <rect x="129" y="286" width="14" height="44" rx="2" fill="#4f331d" stroke="#8c6239" stroke-width="1"/>
    <path d="M136 254 C146 266, 146 284, 136 286 C126 284, 126 266, 136 254 Z" fill="#ffaa33"/>
    <path d="M136 264 C141 271, 141 282, 136 284 C131 282, 131 271, 136 264 Z" fill="#fff6c4"/>

    <!-- Tocha Direita -->
    <circle cx="1064" cy="276" r="85" fill="url(#torchGlow)"/>
    <rect x="1057" y="286" width="14" height="44" rx="2" fill="#4f331d" stroke="#8c6239" stroke-width="1"/>
    <path d="M1064 254 C1074 266, 1074 284, 1064 286 C1054 284, 1054 266, 1064 254 Z" fill="#ffaa33"/>
    <path d="M1064 264 C1069 271, 1069 282, 1064 284 C1059 282, 1059 271, 1064 264 Z" fill="#fff6c4"/>
  </g>
</svg>
